name: Release

on:
  push:
    branches: [master]
    paths:
      - 'CHANGELOG.md'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from CHANGELOG
        id: version
        run: |
          # Only X.Y.Z headings count, so an "### [Unreleased]" section never becomes tag "v"
          VERSION=$(grep -m1 -E '^### [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^### ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::No '### X.Y.Z' heading found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if release exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '$0 ~ "^### "v"([^0-9.]|$)" {p=1; next} /^### /{if(p) exit} p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No release notes under ### $VERSION"
            exit 1
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
